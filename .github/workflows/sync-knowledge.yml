# Nightly check of the law library against official download links.
# New versions are saved as "pending" and must be approved on the Law library page.
name: Law library update check

# The daily check now runs on Vercel in Mumbai (vercel.json crons -> /api/cron/check-laws), because
# official Indian sites time out for GitHub's US servers. This workflow is kept for manual runs only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check official links
        run: npx tsx scripts/sync-knowledge.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
